services:
  - type: web
    name: triai-api
    runtime: docker
    plan: free
    healthCheckPath: /api/fhir/metadata
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: PREFERRED
      - key: TRIAGE_MODEL_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRIAGE_MODEL_TIMEOUT_SECONDS
        value: "55"
