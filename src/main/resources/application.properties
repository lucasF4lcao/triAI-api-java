spring.application.name=triAI-api-java

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.property-naming-strategy=SNAKE_CASE

triage-model.base-url=${TRIAGE_MODEL_URL:https://modelo-api-j2fd.onrender.com}
triage-model.timeout-seconds=${TRIAGE_MODEL_TIMEOUT_SECONDS:30}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}
